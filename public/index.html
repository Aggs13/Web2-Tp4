<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TP4 - Mini Chat WebSocket</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- Ventana emergente para elegir nombre -->
  <div id="name-modal" class="modal-overlay">
    <form id="join-form" class="modal">
      <h3>Ingresá tu nombre</h3>
      <input id="name-input" type="text" required autofocus />
      <p id="join-error" style="color: #f87171; margin: 0; font-size: 0.9rem; min-height: 1.2em;"></p>
      <button type="submit">Entrar al chat</button>
    </form>
  </div>

  <!-- Contenedor principal: Productos a la izq + Chat al centro + Conectados a la der -->
  <div class="app-layout">
    <!-- Lista de productos propuestos a la izquierda -->
    <aside class="products-panel">
      <div class="users-header">Productos (<span id="products-count">0</span>)</div>
      <ul id="products-list"></ul>
    </aside>

    <!-- Caja de chat -->
    <div class="chat-box">
      <div class="chat-header">
        <h2>Chat WebSocket</h2>
        <div class="header-right">
          <span id="current-user" class="user-badge">Sin nombre</span>
          <a href="/pantalla" class="screen-link">Pantalla</a>
        </div>
      </div>

      <form id="product-form" class="chat-form">
        <input id="product-id-input" type="text" placeholder="IDs de productos (ej: 1, 2, 9999)" autocomplete="off" required />
        <button type="submit">Proponer</button>
      </form>

      <ul id="messages"></ul>

      <form id="chat-form" class="chat-form">
        <input id="text-input" type="text" placeholder="Escribí un mensaje..." autocomplete="off" enterkeyhint="send" />
        <button id="send-btn" type="submit">Enviar</button>
      </form>
    </div>

    <!-- Lista de usuarios conectados a la derecha -->
    <aside class="users-panel">
      <div class="users-header">Conectados (<span id="users-count">0</span>)</div>
      <ul id="users-list"></ul>
    </aside>
  </div>

  <script>
    // 1. Conecta por WebSocket al mismo host (usa wss:// en HTTPS como Render y ws:// en localhost)
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocol}//${location.host}`);

    const nameModal = document.getElementById("name-modal");
    const joinForm = document.getElementById("join-form");
    const nameInput = document.getElementById("name-input");
    const joinError = document.getElementById("join-error");
    const currentUser = document.getElementById("current-user");
    const messagesList = document.getElementById("messages");
    const chatForm = document.getElementById("chat-form");
    const textInput = document.getElementById("text-input");
    const sendBtn = document.getElementById("send-btn");
    const usersList = document.getElementById("users-list");
    const usersCount = document.getElementById("users-count");
    const productsList = document.getElementById("products-list");
    const productsCount = document.getElementById("products-count");
    const productForm = document.getElementById("product-form");
    const productIdInput = document.getElementById("product-id-input");
    const votedIds = new Set();

    // Identificador único de esta pestaña para poder reconectar con el mismo nombre al volver de /pantalla
    let clientId = sessionStorage.getItem("tp4_client_id");
    if (!clientId) {
      clientId = Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem("tp4_client_id", clientId);
    }

    // Cierra limpiamente el WebSocket al salir hacia /pantalla
    window.addEventListener("pagehide", () => {
      ws.close();
    });

    // Si vuelve con el botón "Atrás" del navegador desde caché, recarga para reconectar el WebSocket
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) location.reload();
    });

    // Si ya tenía nombre guardado en esta pestaña, oculta el modal y se vuelve a unir solo al conectar
    const savedName = sessionStorage.getItem("tp4_name");
    if (savedName) {
      nameModal.classList.add("hidden");
    }

    ws.addEventListener("open", () => {
      const stored = sessionStorage.getItem("tp4_name");
      if (stored) {
        ws.send(JSON.stringify({ type: "join", name: stored, clientId }));
      }
    });

    // Evita que tocar el botón "Enviar" le saque el foco al input y cierre el teclado en el celular
    sendBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
    });

    // 2. Cuando el usuario envía su nombre en la ventana emergente
    joinForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;

      joinError.textContent = "";
      // Envía el mensaje "join" al servidor y espera su confirmación
      ws.send(JSON.stringify({ type: "join", name, clientId }));
    });

    // 3. Cuando el usuario envía un mensaje de chat
    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = textInput.value.trim();
      if (!text) {
        textInput.focus();
        return;
      }

      // Envía el mensaje "chat" al servidor
      ws.send(JSON.stringify({ type: "chat", text }));
      textInput.value = "";
      textInput.focus(); // Mantiene el teclado abierto
    });

    // Proponer uno o varios productos por ID separados por coma
    productForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const rawParts = productIdInput.value.split(",").map((s) => s.trim()).filter(Boolean);
      const ids = rawParts.map((s) => Number(s));

      // Si algún valor no es entero positivo, el servidor igual lo valida, pero acá permitimos enviarlo o filtrarlo
      if (ids.some((n) => !Number.isInteger(n) || n <= 0)) {
        const li = document.createElement("li");
        li.className = "error";
        li.textContent = "Error: Ingresá solo números enteros positivos separados por coma (ej: 1, 2, 5)";
        messagesList.appendChild(li);
        messagesList.scrollTop = messagesList.scrollHeight;
        return;
      }

      ws.send(JSON.stringify({ type: "get_product", ids }));
      productIdInput.value = "";
    });

    // 4. Cuando llega un mensaje desde el servidor
    ws.addEventListener("message", (event) => {
      const msg = JSON.parse(event.data);
      

      if (msg.type === "joined") {
        sessionStorage.setItem("tp4_name", msg.name);
        currentUser.dataset.joined = "1";
        currentUser.textContent = `Conectado como: ${msg.name}`;
        nameModal.classList.add("hidden");
        textInput.focus();
        return;
      }

      if (msg.type === "error" && (!nameModal.classList.contains("hidden") || !currentUser.dataset.joined)) {
        sessionStorage.removeItem("tp4_name");
        nameModal.classList.remove("hidden");
        joinError.textContent = msg.message;
        nameInput.focus();
        return;
      }

      if (msg.type === "product_result") {
        console.log("Resultado de propuesta:", msg.result);
        for (const f of msg.result.failed ?? []) {
          const li = document.createElement("li");
          li.className = "error";
          li.textContent = `Producto ${f.id ?? "?"}: ${f.message}`;
          messagesList.appendChild(li);
        }
        messagesList.scrollTop = messagesList.scrollHeight;
        return;
      }

      if (msg.type === "productos") {
        console.log("Lista de productos:", msg.products);
        productsCount.textContent = msg.products.length;
        productsList.innerHTML = "";

        for (const p of msg.products) {
          const item = document.createElement("li");
          item.className = "product-card";

          const img = document.createElement("img");
          img.src = p.thumbnail;
          img.alt = p.title;

          const info = document.createElement("div");
          info.className = "product-info";

          const title = document.createElement("div");
          title.className = "product-title";
          title.textContent = `#${p.id} ${p.title}`;

          const meta = document.createElement("div");
          meta.className = "product-meta";
          meta.textContent = `$${p.price} · por ${p.proposedBy} · ★ ${p.votes}`;

          const actions = document.createElement("div");
          actions.className = "product-actions";

          const hasVoted = votedIds.has(p.id);
          const voteBtn = document.createElement("button");
          voteBtn.type = "button";
          voteBtn.className = hasVoted ? "btn-sm btn-unvote" : "btn-sm btn-vote";
          voteBtn.textContent = hasVoted ? "Sacar voto" : "★ Votar";
          voteBtn.addEventListener("click", () => {
            if (votedIds.has(p.id)) {
              votedIds.delete(p.id);
              ws.send(JSON.stringify({ type: "unvote", id: p.id }));
            } else {
              votedIds.add(p.id);
              ws.send(JSON.stringify({ type: "vote", id: p.id }));
            }
          });

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "btn-sm btn-remove";
          removeBtn.textContent = "✕";
          removeBtn.title = "Quitar producto";
          removeBtn.addEventListener("click", () => {
            ws.send(JSON.stringify({ type: "remove", id: p.id }));
          });

          actions.appendChild(voteBtn);
          actions.appendChild(removeBtn);

          info.appendChild(title);
          info.appendChild(meta);
          info.appendChild(actions);
          item.appendChild(img);
          item.appendChild(info);
          productsList.appendChild(item);
        }
        return;
      }

      if (msg.type === "participantes") {
        usersCount.textContent = msg.participants.length;
        usersList.innerHTML = "";
        for (const name of msg.participants) {
          const userLi = document.createElement("li");
          userLi.textContent = name;
          usersList.appendChild(userLi);
        }
        return;
      }

      const li = document.createElement("li");

      if (msg.type === "chat") {
        const strong = document.createElement("strong");
        strong.textContent = `${msg.name}: `;
        li.appendChild(strong);
        li.appendChild(document.createTextNode(msg.text));
      } else if (msg.type === "error") {
        li.className = "error";
        li.textContent = `Error: ${msg.message}`;
      } else {
        return;
      }

      messagesList.appendChild(li);
      messagesList.scrollTop = messagesList.scrollHeight;
    });
  </script>
</body>
</html>
